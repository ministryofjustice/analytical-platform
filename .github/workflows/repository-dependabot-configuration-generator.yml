---
name: Dependabot Configuration Generator

on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main

permissions: read-all

jobs:
  dependabot-configuration-generator:
    name: Dependabot Configuration Generator
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Obtain Octo STS Token
        id: octo_sts
        uses: octo-sts/action@6177b4481c00308b3839969c3eca88c96a91775f # v1.0.0
        with:
          scope: ministryofjustice/analytical-platform
          identity: dependabot-configuration-generator

      - name: Run Dependabot Configuration Generator
        id: run_dependabot_configuration_generator
        run: |
          bash scripts/dependabot/configuration-generator.sh

      - name: Detect Changes in .github/dependabot.yml
        id: detect_changes
        run: |
          if git diff --quiet --exit-code .github/dependabot.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit Changes
        id: commit_changes
        if: steps.detect_changes.outputs.changed == 'true'
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          path=".github/dependabot.yml"
          contents="$(base64 -w 0 "${path}")"

          existing_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${branch}" \
              --jq '.sha' 2>/dev/null || echo ""
          )"

          if [ -n "${existing_sha}" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message="🤖 Update .github/dependabot.yml" \
              -f content="${contents}" \
              -f branch="${branch}" \
              -f sha="${existing_sha}"
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message="🤖 Update .github/dependabot.yml" \
              -f content="${contents}" \
              -f branch="${branch}"
          fi
        env:
          GH_TOKEN: ${{ steps.octo_sts.outputs.token }}
