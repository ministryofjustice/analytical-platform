---
name: Secret expiry check

on: # yamllint disable-line rule:truthy
  workflow_dispatch:

jobs:
  check-secret-expiry:
    name: Check secret expiry
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::042130406152:role/github-actions-secret-check
          aws-region: eu-west-2

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install boto3

      - name: Check secret expiry dates
        id: check_secret_expiry
        run: python scripts/secret-scan/check_secret_expiry.py

      - name: Configure AWS Credentials for Slack Webhook
        if: >-
          steps.check_secret_expiry.outputs['expired-count'] > 0 ||
          steps.check_secret_expiry.outputs['critical-count'] > 0 ||
          steps.check_secret_expiry.outputs['warning-count'] > 0
        id: configure_aws_credentials_slack_webhook
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::042130406152:role/GlobalGitHubActionAccess
          aws-region: eu-west-1

      - name: Retrieve AWS Secrets Manager Secrets
        if: >-
          steps.check_secret_expiry.outputs['expired-count'] > 0 ||
          steps.check_secret_expiry.outputs['critical-count'] > 0 ||
          steps.check_secret_expiry.outputs['warning-count'] > 0
        id: retrieve_aws_secrets_manager_secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            SLACK_WEBHOOK_URL, arn:aws:secretsmanager:eu-west-1:042130406152:secret:secret-scan-webhook-url

      - name: Notify Slack of Expired Secrets
        if: steps.check_secret_expiry.outputs['expired-count'] > 0
        id: slack_notification_expired
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "*Expired*\n${{ steps.check_secret_expiry.outputs['expired-messages'] }}"
            }

      - name: Notify Slack of Critical Secrets
        if: steps.check_secret_expiry.outputs['critical-count'] > 0
        id: slack_notification_critical
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "*Critical*\n${{ steps.check_secret_expiry.outputs['critical-messages'] }}"
            }

      - name: Notify Slack of Warning Secrets
        if: steps.check_secret_expiry.outputs['warning-count'] > 0
        id: slack_notification_warning
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "*Warning*\n${{ steps.check_secret_expiry.outputs['warning-messages'] }}"
            }
