name: Dependabot Auto-merge
# zizmor: ignore[dangerous-triggers] -- This workflow never checks out or executes pull request code; it only performs guarded GitHub API merges for Dependabot-authored PRs.
on: # yamllint disable-line rule:truthy
  pull_request_target: #zizmor: ignore[dangerous-triggers]
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - Terraform
      - 🦝 Super Linter
      - ✍️ Check Commit Signatures
      - Dependency review
      - Dependabot Configuration Generator
      - 🧪 Test Documentation
      - Pull request labeler
    types:
      - completed

permissions: {}

jobs:
  dependabot-auto-merge:
    name: Dependabot Auto-merge
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Obtain Octo STS Token
        id: octo_sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: ministryofjustice/analytical-platform
          identity: dependabot-auto-merge

      - name: Merge eligible Dependabot pull requests
        id: merge_eligible_dependabot_pull_requests
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ steps.octo_sts.outputs.token }}
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo

            const pullRequestNumbers = []

            if (context.eventName === 'pull_request_target') {
              pullRequestNumbers.push(context.payload.pull_request.number)
            }

            if (context.eventName === 'workflow_run') {
              if (!['pull_request', 'pull_request_target'].includes(context.payload.workflow_run.event)) {
                console.log('Skipping workflow_run event because it was not triggered by a pull request')
                return
              }

              if (context.payload.workflow_run.conclusion !== 'success') {
                console.log(`Skipping workflow_run event because ${context.payload.workflow_run.name} did not succeed`)
                return
              }

              let workflowRunPullRequestNumber = context.payload.workflow_run.pull_requests?.[0]?.number

              // pull_requests can be empty (e.g. pull_request_target runs on Dependabot branches), so fall back to the head branch
              if (!workflowRunPullRequestNumber) {
                const { data: openPullRequests } = await github.rest.pulls.list({
                  owner,
                  repo,
                  state: 'open',
                  head: `${owner}:${context.payload.workflow_run.head_branch}`,
                })
                workflowRunPullRequestNumber = openPullRequests.find(pr => pr.head.sha === context.payload.workflow_run.head_sha)?.number
              }

              if (!workflowRunPullRequestNumber) {
                console.log(`No pull request linked to this ${context.payload.workflow_run.name} workflow run`)
                return
              }

              pullRequestNumbers.push(workflowRunPullRequestNumber)
            }

            const uniquePullRequestNumbers = [...new Set(pullRequestNumbers)]

            if (uniquePullRequestNumbers.length === 0) {
              console.log('No pull requests linked to this event')
              return
            }

            for (const pullNumber of uniquePullRequestNumbers) {
              const { data: pullRequest } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pullNumber,
              })

              if (pullRequest.state !== 'open') {
                console.log(`Skipping #${pullNumber}: pull request is not open`)
                continue
              }

              if (pullRequest.user?.login !== 'dependabot[bot]') {
                console.log(`Skipping #${pullNumber}: pull request is not opened by Dependabot`)
                continue
              }

              const { data: labels } = await github.rest.issues.listLabelsOnIssue({
                owner,
                repo,
                issue_number: pullNumber,
              })

              const hasAutoMergeLabel = labels.some(label => label.name === 'auto-merge-dependabot')

              if (!hasAutoMergeLabel) {
                console.log(`Skipping #${pullNumber}: missing auto-merge-dependabot label`)
                continue
              }

              // main has no required status checks, so enforce them here; keep in sync with each workflow's path filters
              const changedFiles = (await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: pullNumber,
                per_page: 100,
              })).map(file => file.filename)

              const requiredWorkflows = [
                '🦝 Super Linter',
                '✍️ Check Commit Signatures',
                'Dependency review',
                'Dependabot Configuration Generator',
                'Pull request labeler',
              ]

              if (changedFiles.some(file => file.startsWith('terraform/') || file === '.github/workflows/terraform.yml')) {
                requiredWorkflows.push('Terraform')
              }

              if (changedFiles.some(file => file.startsWith('source/') || file.startsWith('config/'))) {
                requiredWorkflows.push('🧪 Test Documentation')
              }

              const workflowRuns = (await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner,
                repo,
                head_sha: pullRequest.head.sha,
                per_page: 100,
              })).filter(run =>
                ['pull_request', 'pull_request_target'].includes(run.event) &&
                run.path !== '.github/workflows/repository-dependabot-auto-merge.yml'
              )

              // A workflow can run more than once per commit (e.g. on edited), so only the latest run counts
              const latestRunByWorkflow = new Map()
              for (const run of workflowRuns) {
                const existing = latestRunByWorkflow.get(run.workflow_id)
                if (!existing || new Date(run.created_at) > new Date(existing.created_at)) {
                  latestRunByWorkflow.set(run.workflow_id, run)
                }
              }
              const latestRuns = [...latestRunByWorkflow.values()]

              const missingWorkflows = requiredWorkflows.filter(name => !latestRuns.some(run => run.name === name))
              const pendingRuns = latestRuns.filter(run => run.status !== 'completed')
              const failedRuns = latestRuns.filter(run =>
                run.status === 'completed' && !['success', 'skipped', 'neutral'].includes(run.conclusion)
              )

              if (failedRuns.length > 0) {
                console.log(`Skipping #${pullNumber}: failed workflows: ${failedRuns.map(run => run.name).join(', ')}`)
                continue
              }

              if (missingWorkflows.length > 0) {
                console.log(`Skipping #${pullNumber}: workflows not yet started: ${missingWorkflows.join(', ')}`)
                continue
              }

              if (pendingRuns.length > 0) {
                console.log(`Skipping #${pullNumber}: workflows still running: ${pendingRuns.map(run => run.name).join(', ')}`)
                continue
              }

              try {
                const { data: mergeResult } = await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number: pullNumber,
                  merge_method: 'squash',
                  sha: pullRequest.head.sha,
                })

                if (mergeResult.merged) {
                  console.log(`Merged #${pullNumber}: ${mergeResult.message}`)
                } else {
                  console.log(`Did not merge #${pullNumber}: ${mergeResult.message}`)
                }
              } catch (error) {
                const status = error.status || error.response?.status
                if (status === 405) {
                  // Branch may be behind main; update it to trigger a fresh CI run and retry via workflow_run.
                  try {
                    await github.rest.pulls.updateBranch({ owner, repo, pull_number: pullNumber })
                    console.log(`Updated branch for #${pullNumber} — merge will be retried after CI re-runs`)
                  } catch (updateError) {
                    const updateStatus = updateError.status || updateError.response?.status
                    if (updateStatus === 422) {
                      console.log(`Branch for #${pullNumber} is already up to date — merge blocked by pending checks`)
                    } else {
                      console.log(`Could not update branch for #${pullNumber}: ${updateError.message}`)
                    }
                  }
                  continue
                }

                if (status === 409 || status === 422) {
                  console.log(`Merge not ready for #${pullNumber}. The workflow will retry on a later event.`)
                  continue
                }

                throw error
              }
            }
