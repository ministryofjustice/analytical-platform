# yaml-language-server: $schema=https://raw.githubusercontent.com/octo-sts/app/refs/heads/main/pkg/octosts/octosts.TrustPolicy.json
# Identity for local Terraform runs, exchanging an AWS outbound identity federation
# token (see scripts/terraform/local-github-token.sh) for a GitHub token. The role
# is provisioned by terraform/aws/analytical-platform-management-production/octo-sts-local-terraform-runs.
#
# TODO: replace issuer once `terraform apply` has run and the
# outbound_web_identity_federation_issuer output is known.
issuer: https://REPLACE_WITH_OUTBOUND_WEB_IDENTITY_FEDERATION_ISSUER_OUTPUT
subject: arn:aws:iam::042130406152:role/octo-sts-local-terraform

permissions:
  members: read
